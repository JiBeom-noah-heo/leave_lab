<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼피 국가별 마진 계산기 (태국·대만·베트남)</title>
<meta name="description" content="한국 셀러 크로스보더 기준 쇼피 판매수수료·결제수수료·기술지원비·SLS 배송비·VAT·페이오니아 인출 수수료를 반영한 순마진 계산기. 기준일 2026-09-28.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{--bg:#f6f5f1;--surface:#fff;--ink:#1d1f22;--muted:#6b6f76;--line:#dcdad3;--accent:#1f5f8b;--accent-soft:#e3edf5;--bad:#a35a1a}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#16181b;--surface:#1f2225;--ink:#e8e7e2;--muted:#9a9ea6;--line:#33373c;--accent:#7fb3d9;--accent-soft:#233543;--bad:#e7b487}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",system-ui,sans-serif;font-size:15px;line-height:1.6;padding:24px 16px 56px}
.wrap{max-width:640px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}.sub{color:var(--muted);margin:0 0 20px;font-size:14px}
form{display:grid;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
label{display:grid;gap:4px;font-size:13.5px;color:var(--muted)}
input,select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:480px){.row{grid-template-columns:1fr}}
.out{margin-top:16px;background:var(--accent-soft);border-radius:10px;padding:16px}
.out .big{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}.out .big.neg{color:var(--bad)}
.out table{width:100%;font-size:13.5px;border-collapse:collapse;margin-top:10px}.out td{padding:4px 0;border-bottom:1px solid var(--line)}.out td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.foot{margin-top:24px;font-size:13px;color:var(--muted)}.foot a{color:var(--accent)}
</style>
</head>
<body><div class="wrap">
<h1>쇼피 국가별 마진 계산기</h1>
<p class="sub">한국 셀러 크로스보더(SLS) 기준. 값은 정산 화면과 대조해서 쓰세요.</p>
<form id="f">
  <div class="row">
    <label>마켓<select id="mk"><option value="TH">태국</option><option value="TW">대만</option><option value="VN">베트남</option></select></label>
    <label>판매가 (현지 통화)<input id="price" type="number" value="299" min="0"></label>
  </div>
  <div class="row">
    <label>공급가 (원)<input id="cost" type="number" value="4500" min="0"></label>
    <label>국내 배송·재라벨 (원)<input id="dom" type="number" value="3500" min="0"></label>
  </div>
  <div class="row">
    <label>실중량 (g)<input id="wt" type="number" value="250" min="1"></label>
    <label>환율 (원/현지)<input id="fx" type="number" step="0.01" value="38.5"></label>
  </div>
</form>
<div class="out">
  <div>순마진 (원)</div><div class="big" id="net">—</div>
  <table id="detail"></table>
</div>
<p class="foot">기준일 2026-09-28. 수수료율은 쇼피 가격 계산 도구 수식 기준 대표값이며 카테고리·셀러 등급·프로모션에 따라 다릅니다. 2026-02-01부터 태국·베트남에 기술지원비 5%가 추가됩니다. 배송비는 SLS 구간 요율의 근사값이니 셀러센터 요율표로 교체하세요.<br>
근거: <a href="https://sellitmate.com/shopee-fees.html" target="_blank" rel="nofollow noopener">쇼피 수수료 정리</a> · <a href="https://shopeecalculat.com/guides/shopee-fees-2026/" target="_blank" rel="nofollow noopener">기술지원비 안내</a> · <a href="https://shopee.kr/solution/sls.php" target="_blank" rel="nofollow noopener">SLS</a></p>
</div>
<script>
// 대표값. 셀러센터 요율표로 교체할 것.
const M={
  TH:{fee:0.2498,tech:0.05,vat:0.07,ship:(g)=>g<=500?95:g<=1000?140:190+Math.ceil((g-1000)/500)*45,cur:'THB'},
  TW:{fee:0.16,tech:0,vat:0,ship:(g)=>g<=500?60:g<=1000?90:120+Math.ceil((g-1000)/500)*30,cur:'TWD'},
  VN:{fee:0.19,tech:0.05,vat:0.08,ship:(g)=>g<=500?45000:g<=1000?65000:85000+Math.ceil((g-1000)/500)*20000,cur:'VND'}
};
const PAYONEER=0.012;
const $=id=>document.getElementById(id);
function calc(){
  const m=M[$('mk').value],p=+$('price').value,fx=+$('fx').value,g=+$('wt').value;
  const fee=p*m.fee,tech=p*m.tech,vat=(fee+tech)*m.vat,ship=m.ship(g);
  const settle=p-fee-tech-vat-ship,payout=settle*(1-PAYONEER);
  const krw=payout*fx,net=krw-(+$('cost').value)-(+$('dom').value);
  $('net').textContent=Math.round(net).toLocaleString()+' 원';$('net').className='big'+(net<0?' neg':'');
  const f=v=>Math.round(v).toLocaleString();
  $('detail').innerHTML=[['판매가',f(p)+' '+m.cur],['판매+결제수수료 '+(m.fee*100).toFixed(2)+'%','-'+f(fee)],['기술지원비 '+(m.tech*100)+'%','-'+f(tech)],['수수료 VAT '+(m.vat*100)+'%','-'+f(vat)],['SLS 배송비 (근사)','-'+f(ship)],['정산금','='+f(settle)],['페이오니아 1.2% 후 원화','='+f(krw)+' 원'],['공급가+국내비용','-'+f(+$('cost').value+ +$('dom').value)+' 원']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('');
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',calc));calc();
</script>
</body></html>
